name: kingdom_of_steps
description: "Kingdom of Steps - مملكة الخطوات - Gamified step tracking app"
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # State Management
  provider: ^6.1.1

  # Step Tracking - Direct sensor access (simple, one permission)
  pedometer: ^4.0.1
  permission_handler: ^11.1.0

  # Health Connect (optional, for historical data sync)
  health: ^13.3.0

  # Local Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI Components
  google_fonts: ^6.1.0
  flutter_animate: ^4.3.0
  percent_indicator: ^4.2.3
  fl_chart: ^0.66.0

  # Notifications (add later when needed)
  # flutter_local_notifications: ^17.0.0

  # Background Services (add later when needed)
  # workmanager: ^0.5.2

  # Icons
  cupertino_icons: ^1.0.8

  # URL Launcher (for Play Store links)
  url_launcher: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/

  # fonts:
  #   - family: Cairo
  #     fonts:
  #       - asset: assets/fonts/Cairo-Regular.ttf
  #       - asset: assets/fonts/Cairo-Bold.ttf
  #         weight: 700
